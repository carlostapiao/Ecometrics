name: Destruir entorno EcoMetrics en Azure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe DESTROY para eliminar los recursos con costo en Azure (conserva bootstrap y OIDC)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destruir recursos de aplicación, datos y observabilidad
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7

      - name: Inicializar Terraform con backend remoto
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_SA }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=dev.terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Destruir módulos con costo (aplicacion, datos, observabilidad)
        working-directory: infra/terraform/environments/dev
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}
          TF_VAR_tfstate_resource_group_name: ${{ vars.TF_STATE_RG }}
          TF_VAR_tfstate_storage_account_name: ${{ vars.TF_STATE_SA }}
        run: |
          terraform destroy -auto-approve \
            -target=module.aplicacion \
            -target=module.datos \
            -target=module.observabilidad
