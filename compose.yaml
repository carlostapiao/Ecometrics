name: cerebro-ecometrics
services:
  db:
    image: postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecometrics}
      POSTGRES_USER: ${POSTGRES_USER:-ecometrics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta scripts/iniciar.ps1}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  migrate:
    image: cerebro-ecometrics-web:dev
    build: .
    environment: &app_environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Ejecuta scripts/iniciar.ps1}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      POSTGRES_DB: ${POSTGRES_DB:-ecometrics}
      POSTGRES_USER: ${POSTGRES_USER:-ecometrics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta scripts/iniciar.ps1}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ECOMETRICS_MEDIA_ROOT: /data/evidencias
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "migrate", "--noinput"]
    volumes:
      - ./src:/app
  web:
    image: cerebro-ecometrics-web:dev
    build: .
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WEB_PORT:-8010}:8000"
    volumes:
      - ./src:/app
      - evidencias_data:/data/evidencias
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
volumes:
  postgres_data:
  evidencias_data:
